name: Release

# 发布流水线：tag 推送（v*，通常由 Tag Release 一键发版触发）或手动指定已存在 tag。
# 测试前置（gui 包除外——其 go:embed 需要 frontend/dist，CI 不构建前端），
# 版本注入沿用 tag / dispatch 输入，release notes 由 git-cliff 生成，产物附 sha256。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v0.0.9，需已推送）'
        required: true
      version:
        description: '注入二进制的版本号（如 0.0.9；缺省按 tag 推导）'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Test
        run: go test ./cmd/... ./internal/... ./pkg/... .

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="v${{ inputs.version }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare build vars
        id: buildvars
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          BUILDTIME=$(date -u '+%Y-%m-%dT%H:%M:%S')
          LDFLAGS="-s -w -X github.com/cicbyte/reference/cmd/version.Version=${VERSION} -X github.com/cicbyte/reference/cmd/version.GitCommit=${COMMIT} -X github.com/cicbyte/reference/cmd/version.BuildTime=${BUILDTIME}"
          echo "ldflags=${LDFLAGS}" >> "$GITHUB_OUTPUT"

      - name: Build Windows
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags "${{ steps.buildvars.outputs.ldflags }}" -o dist/reference_windows_amd64.exe

      - name: Build Linux
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags "${{ steps.buildvars.outputs.ldflags }}" -o dist/reference_linux_amd64

      - name: Build macOS (Intel)
        env:
          GOOS: darwin
          GOARCH: amd64
        run: go build -ldflags "${{ steps.buildvars.outputs.ldflags }}" -o dist/reference_darwin_amd64

      - name: Build macOS (Apple Silicon)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build -ldflags "${{ steps.buildvars.outputs.ldflags }}" -o dist/reference_darwin_arm64

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          # 多行 body 经文件传给 release 最稳
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Checksums
        run: |
          cd dist
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: dist/*
